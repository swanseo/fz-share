<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캐릭터 제작 경로 — 실증에서 전환까지</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://swanseo.github.io/fz-share/pipeline.html">
<meta http-equiv="refresh" content="0; url=./pipeline.html">
<meta name="theme-color" content="#161519">
</head>
<body>
<style>
:root{--ground:#F4F2F6; --surface:#FFFFFF; --ink:#1A181F; --ink-2:#5D5766; --line:#DDD8E3; --neo:#D42A80}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--ground:#161519; --surface:#1F1D24; --ink:#F0EDF4; --ink-2:#A9A2B5; --line:#302D38; --neo:#F04D9B}
}
:root[data-theme="dark"]{--ground:#161519; --surface:#1F1D24; --ink:#F0EDF4; --ink-2:#A9A2B5; --line:#302D38; --neo:#F04D9B}
body{
  margin:0; min-height:100vh; display:grid; place-items:center; background:var(--ground); color:var(--ink);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  line-height:1.7; padding:24px;
}
.box{
  background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--neo);
  border-radius:4px; padding:26px 28px; max-width:520px;
}
h1{margin:0 0 10px; font-size:20px; font-weight:750; letter-spacing:-.018em}
p{margin:0 0 8px; color:var(--ink-2); font-size:15px}
a{color:var(--neo); font-weight:700}
</style>
<div class="box">
  <h1>한 페이지로 합쳤습니다</h1>
  <p>이 글(실증)과 이어지는 글(방식 전환)이 하나의 페이지가 됐습니다. 잠시 후 자동으로 이동합니다.</p>
  <p style="margin-top:14px"><a href="./pipeline.html">캐릭터 제작 경로 — 실증에서 전환까지 &rarr;</a></p>
</div>
</body>
</html>
